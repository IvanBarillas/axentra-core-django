{# templates/navigation/module_item.html #}

<a href="{{ href|default:'#' }}"
    {% if hx_target %}
        hx-get="{{ href }}"
        hx-target="{{ hx_target }}"
        hx-swap="{{ hx_swap|default:'innerHTML' }}"
    {% endif %}
    {% if hx_push_url %}
        hx-push-url="{{ hx_push_url }}"
    {% endif %}
    class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-bold uppercase tracking-tight transition-all group border border-transparent {% if active %}bg-brand-accent text-white shadow-sm{% else %}text-white/60 hover:bg-white/10 hover:text-white{% endif %}"
>
    <i data-lucide="{{ icon|default:'circle' }}"
       class="w-3.5 h-3.5 shrink-0 {% if active %}text-white{% else %}text-white/50 group-hover:text-white{% endif %}">
    </i>

    <span class="truncate">
        {{ title }}
    </span>
</a>
