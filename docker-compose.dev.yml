services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.container
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - axentra_dev

  web:
    build:
      context: .
    command: uv run python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped
    # Alinea el UID/GID del proceso con el usuario del host para que los
    # archivos escritos en el bind mount (db.sqlite3, sent_emails, etc.)
    # sean editables fuera del contenedor bajo Podman rootless. Exporta
    # UID/GID antes de levantar el stack, p. ej.:
    #   UID=$(id -u) GID=$(id -g) podman-compose -f docker-compose.dev.yml up
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env.container
    environment:
      DJANGO_ENV: container
    volumes:
      - .:/app:Z
      - /app/.venv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - axentra_dev

volumes:
  postgres_dev_data:

networks:
  axentra_dev:
